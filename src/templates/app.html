<title>{{ t.title }}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{ t.description }}">
<script>{{ shared.theme_early }}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ fonts }}">
{% for src in t.scripts %}<script src="{{ src }}"></script>
{% endfor %}{% if t.kit %}<style>
{{ shared.learnkit_css }}</style>
<style>
:root { --accent: {{ t.accent[0] }}; --accent-soft: {{ t.accent[2] }}; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: {{ t.accent[1] }}; } }
:root[data-theme="dark"] { --accent: {{ t.accent[1] }}; }
</style>
{% endif %}<style>
{{ app.css }}</style>
<style>
{{ shared.crumbs_css }}{{ shared.toggle_css }}
</style>

<div class="wrap">
  <header class="top">
    {{ crumbs }}
    <h1>{{ t.title }}</h1>
    <p>{{ t.intro }}</p>
    <p{% if t.worksheet %} style="display:flex; flex-wrap:wrap; gap:8px"{% endif %}><a class="btn" href="{{ base }}factsheets/{{ t.slug }}.pdf" target="_blank" rel="noopener">{{ t.factsheet }}</a>{% if t.worksheet %}<a class="btn" href="{{ base }}aufgaben/{{ t.slug }}.pdf" target="_blank" rel="noopener">Übungsaufgaben als PDF ↓</a>{% endif %}</p>
  </header>
{{ app.body }}</div>

{% if t.kit %}<script>
{{ shared.learnkit_js }}</script>
{% endif %}<script>
{{ app.js }}</script>
<script>
{{ shared.toggle_js }}</script>
<script>
{{ shared.crumbs_js }}</script>
