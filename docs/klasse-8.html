<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klassenstufe 8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono&display=swap">
<style>
/* Menu pages: grade selection and topic lists */
:root { --bg: #f2f5f7; --surface: #fff; --ink: #15232d; --muted: #536371; --line: #cfd9e0; --bio: #0d6f74; --math: #24539c; --g8: #1f6e8c; --g11: #8e2c5c; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e151b; --surface: #151f27; --ink: #e4ecf0; --muted: #97a8b4; --line: #2a3a46; --bio: #3cc0b8; --math: #7aa7ef; --g8: #5fb6d6; --g11: #e0709f; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.6 "Atkinson Hyperlegible", system-ui, sans-serif; padding: 40px max(16px, env(safe-area-inset-left, 0px)) 48px max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0; line-height: 1.15; }
h1 { font-size: 2.3rem; font-weight: 800; }
.muted { color: var(--muted); margin: 6px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
a.card { display: grid; gap: 6px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
a.card:hover, a.card:focus-visible { border-color: var(--c); outline: none; }
.tag { font: 0.75rem "JetBrains Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); }
.grade { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; color: var(--c); }
.go { color: var(--c); font-weight: 700; }
.subject { display: grid; gap: 12px; }
.subject h2 { font-size: 1.3rem; }
.back { color: inherit; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">← Alle Klassenstufen</a>
    <h1 style="margin-top:12px">Klassenstufe 8</h1>
    <p class="muted">Wähle ein Thema.</p>
  </header>
  <div class="subject">
    <h2>Mathematik</h2>
    <div class="cards">
    <a class="card" href="binomische-formeln.html" style="--c: var(--math)">
      <span class="tag">Terme</span>
      <h2>Binomische Formeln</h2>
      <span class="muted">Die drei Formeln, Erklärung mit Flächen, Trainer mit Lückenaufgaben, Kopfrechen-Trick, Quiz</span>
      <span class="go">Öffnen →</span>
    </a>
    </div>
  </div>
</div>
</body>
</html>
